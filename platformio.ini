; PlatformIO Project Configuration for LilyGo T5 4.7" ESP32-S3 with EPDiy
; Target: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB OPI PSRAM, ED047TC1 960x540 E-Paper)

[platformio]
boards_dir = boards
default_envs = T5-ePaper-S3

[env:T5-ePaper-S3]
platform = espressif32@6.12.0
board = T5-ePaper-S3
framework = arduino
upload_speed = 921600
monitor_speed = 115200

extra_scripts = pre:patch_epdiy.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_EPD_DISPLAY_TYPE_ED047TC1
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DCONFIG_ESP32S3_DATA_CACHE_64KB=1
    -DCONFIG_ESP32S3_DATA_CACHE_LINE_64B=1
    -DRENDER_METHOD_I2S=1
    -I.pio/libdeps/T5-ePaper-S3/epdiy/src
    -I.pio/libdeps/T5-ePaper-S3/epdiy/src/board
    -I.pio/libdeps/T5-ePaper-S3/epdiy/src/output_i2s
    -I.pio/libdeps/T5-ePaper-S3/epdiy/src/output_common
    -I.pio/libdeps/T5-ePaper-S3/epdiy/src/waveforms
    -I.pio/libdeps/T5-ePaper-S3/epdiy/examples/demo/main

lib_deps =
    Wire
    SPI
    lewisxhe/SensorLib @ 0.3.1
    lennarthennigs/Button2 @ 2.3.2
    https://github.com/vroland/epdiy.git

monitor_filters =
    default
    esp32_exception_decoder
